version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - ./services/parking/db/migrations.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  parking:
    build: ./services/parking
    ports:
      - "50051:50051"
    depends_on:
      - postgres
      - redis